<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 490" width="470" height="490" role="img" fill="none" stroke="#000" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><title>A flowchart. Start, then Input N, then a process box setting S to 0 and I to 1. </title><rect width="470" height="490" fill="#fff" stroke="none"/><rect x="135.0" y="10.0" width="110" height="40" rx="20.0" ry="20.0" fill="#fff"/><text x="190" y="35" font-family="'Source Sans 3', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#000" stroke="none">Start</text><line x1="190" y1="50" x2="190" y2="78"/><path d="M190,78 L186.0,70 L194.0,70 Z" fill="#000"/><polygon points="129.8,80.0 270.0,80.0 250.2,124.0 110.0,124.0" fill="#fff"/><text x="190" y="107" font-family="'Source Sans 3', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#000" stroke="none">Input N</text><line x1="190" y1="124" x2="190" y2="152"/><path d="M190,152 L186.0,144 L194.0,144 Z" fill="#000"/><rect x="110.0" y="152.0" width="160" height="52" fill="#fff"/><text x="190" y="174" font-family="'Source Sans 3', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#000" stroke="none">S = 0</text><text x="190" y="192" font-family="'Source Sans 3', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#000" stroke="none">I = 1</text><line x1="190" y1="204" x2="190" y2="240"/><path d="M190,240 L186.0,232 L194.0,232 Z" fill="#000"/><polygon points="190,242.0 285.0,282 190,322.0 95.0,282" fill="#fff"/><text x="190" y="287" font-family="'Source Sans 3', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#000" stroke="none">Is I &gt; N ?</text><text x="204" y="340" font-family="'Source Sans 3', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#000" stroke="none">Yes</text><line x1="190" y1="322" x2="190" y2="356"/><path d="M190,356 L186.0,348 L194.0,348 Z" fill="#000"/><polygon points="129.8,360.0 270.0,360.0 250.2,404.0 110.0,404.0" fill="#fff"/><text x="190" y="387" font-family="'Source Sans 3', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#000" stroke="none">Output S</text><line x1="190" y1="404" x2="190" y2="430"/><path d="M190,430 L186.0,422 L194.0,422 Z" fill="#000"/><rect x="135.0" y="432.0" width="110" height="40" rx="20.0" ry="20.0" fill="#fff"/><text x="190" y="457" font-family="'Source Sans 3', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#000" stroke="none">End</text><line x1="285" y1="282" x2="350" y2="282"/><text x="320" y="272" font-family="'Source Sans 3', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#000" stroke="none">No</text><line x1="350" y1="282" x2="350" y2="205"/><rect x="285.0" y="152.0" width="130" height="52" fill="#fff"/><text x="350" y="174" font-family="'Source Sans 3', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#000" stroke="none">S = S + I</text><text x="350" y="192" font-family="'Source Sans 3', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#000" stroke="none">I = I + 1</text><line x1="350" y1="152" x2="350" y2="120"/><line x1="350" y1="120" x2="190" y2="120"/><path d="M190,120 L198,116.0 L198,124.0 Z" fill="#000"/></svg>